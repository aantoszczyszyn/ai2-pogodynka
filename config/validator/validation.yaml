App\Entity\Location:
    properties:
        city:
            - NotBlank:
                  message: 'Pole miasta jest wymagane.'
                  groups: ['new', 'edit']
        country:
            - NotBlank:
                  message: 'Wpisz kraj.'
                  groups: ['new', 'edit']
        liatitude:
            - NotBlank:
                  message: 'Podaj szerokość.'
                  groups: ['new','edit']
            -   NotEqualTo:
                    value: 0
                    message: 'Szerokość nie może być równa 0.'
                    groups: [ 'new', 'edit' ]

        longitude:
            - NotBlank:
                  message: 'Podaj długość.'
                  groups: ['new','edit']

App\Entity\Measurement:
