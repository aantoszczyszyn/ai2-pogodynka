        date:
            - NotBlank:
                  message: 'Wybierz datę.'
                  groups: ['new', 'edit']
        celcius:
            - NotBlank:
                  message: 'Podaj temperaturę.'
                  groups: ['new', 'edit']
        humidity:
            - NotBlank:
                  message: 'Podaj wilgotność.'
                  groups: ['new', 'edit']
        pressure:
            - NotBlank:
                  message: 'Podaj ciśnienie.'
                  groups: ['new', 'edit']
        windKmh:
            - NotBlank:
                  message: 'Podaj wiatr.'
                  groups: ['new', 'edit']
